services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cis
      POSTGRES_PASSWORD: cis_dev
      POSTGRES_DB: cis
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
volumes:
  redis_data:
  pg_data:
